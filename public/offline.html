<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0b1115" />
    <title>Take Me Portal — Offline</title>
    <style>
      :root{color-scheme:dark;font-family:Arial,sans-serif;background:#0b1115;color:#eef5f7}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));background:radial-gradient(circle at top,#123b4b,#0b1115 56%)}main{width:min(430px,100%);text-align:center;background:#151f24;border:1px solid #34464f;border-radius:24px;padding:34px 24px;box-shadow:0 24px 70px #0008}img{width:84px;height:auto}h1{font-family:Georgia,serif;font-size:30px;margin:20px 0 10px}p{color:#adbdc4;line-height:1.6;margin:0 0 22px}button{min-height:48px;border:0;border-radius:12px;background:#007eae;color:#fff;font-weight:800;padding:0 22px;font-size:16px}
    </style>
  </head>
  <body>
    <main>
      <img src="/take-me-logo-black.png" alt="Take Me" />
      <h1>You’re offline</h1>
      <p>Reconnect to securely load company information and save changes.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
